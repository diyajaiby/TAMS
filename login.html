<!DOCTYPE html>
<html lang="en">
<head>

    'https://www.googletagmanager.com/gtm.js?id='+i+dl;

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - TripCore</title>

  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(135deg, #22466b, #0d223e);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      background: linear-gradient(145deg, #2a5298, #1a355f);
      padding: 40px 36px 44px 36px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 16px 30px rgb(16 40 71 / 40%);
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .container:hover {
      box-shadow: 0 24px 50px rgb(16 40 71 / 55%);
    }
    h2 {
      margin-bottom: 36px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-shadow: 0 2px 6px rgb(45 77 136 / 0.75);
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0 18px 0;
      border-radius: 12px;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      background-color: rgba(255,255,255,0.15);
      color: #fbfbfb;
      transition: 0.3s;
    }
    input:focus {
      outline: none;
      background-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 8px 1px #6a9cf7;
    }
    button {
      width: 100%;
      padding: 16px 0;
      margin-top: 24px;
      border: none;
      border-radius: 28px;
      background: linear-gradient(45deg, #4bb543, #2dd92d);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(45deg, #40a036, #23b224);
    }
    .msg {
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.05rem;
      height: 1.2em;
    }
    a {
      display: block;
      margin-top: 28px;
      color: #a8d1aa;
      text-decoration: underline;
      font-weight: 600;
    }
    #guest-btn {
      width: 100%;
      padding: 14px 0;
      margin-top: 18px;
      border-radius: 28px;
      background: #ccd7e3;
      color: #1e3a7a;
      font-size: 1.13rem;
      font-weight: 900;
      cursor: pointer;
    }
    #guest-btn:hover {
      background: #a9bcd6;
    }
  </style>

</head>

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58DJG5TQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <h2>Login</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username or Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">LOGIN</button>
    </form>

    <div class="msg" id="error-msg"></div>

    <a href="register.html">Create a new account</a>
    <button type="button" id="guest-btn">Continue as Guest</button>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');

    const admin = {
      username: "admin",
      email: "admin@tripcore.com",
      password: "admin123"
    };

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if ((username === admin.username || username === admin.email) && password === admin.password) {
        errorMsg.style.color = "lightgreen";
        errorMsg.textContent = "Admin login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 1000);
        return;
      }

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u =>
        (u.username === username || u.email === username) && u.password === password
      );

      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        errorMsg.style.color = "lightgreen";
        errorMsg.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "user_dashboard.html";
        }, 1000);
      } else {
        errorMsg.style.color = "red";
        errorMsg.textContent = "Invalid credentials!";
      }
    });

    document.getElementById('guest-btn').onclick = function() {
      localStorage.removeItem('currentUser');
      window.location.href = "index.html";
    };
  </script>

</body>
</html>
